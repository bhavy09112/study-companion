# Training Configuration for Study Companion
# Hardware: RTX 4060 Laptop (8GB VRAM)

# Model
base_model: "mistralai/Mistral-7B-Instruct-v0.3"
quantization: "4bit"  # bnb 4-bit quantization for 8GB VRAM

# Training hyperparameters
num_epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
lr_scheduler_type: "cosine"
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 1.0

# Precision
bf16: false   # RTX 4060 supports bf16 but fp16 is safer with 4-bit
fp16: true

# Memory optimization
gradient_checkpointing: true
optim: "paged_adamw_8bit"

# Checkpointing
save_steps: 50
eval_steps: 50
logging_steps: 10
save_total_limit: 3
resume_from_checkpoint: true

# Dataset
max_seq_length: 2048
train_split: 0.9
seed: 42

# Output
output_dir: "training/checkpoints"
logging_dir: "training/logs"

# Monitoring
sample_generation_steps: 50   # Print a sample generation every N steps
